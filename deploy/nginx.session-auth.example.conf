# Example nginx configuration for the public OEDI-SI landing page and a signed-session workspace.

limit_req_zone $binary_remote_addr zone=oedisi_login:10m rate=10r/m;

server {
    listen 80;
    server_name oedisi.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name oedisi.example.org;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/private-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /path/to/oedisi-frontend-app/dist;
    index index.html;

    # The landing page, read-more page, and their built/static assets are public.
    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~ ^/read-more/?$ {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /landing/ {
        try_files $uri =404;
    }

    # nginx validates deployment-managed credentials. FastAPI receives only
    # the validated username and returns a signed HttpOnly session cookie.
    location = /auth/login {
        limit_req zone=oedisi_login burst=5 nodelay;
        limit_req_status 429;
        auth_basic "OEDI-SI";
        auth_basic_user_file /path/to/oedisi.htpasswd;
        proxy_pass http://127.0.0.1:3001/api/auth/session;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/status {
        proxy_pass http://127.0.0.1:3001/api/auth/status;
        proxy_set_header Host $host;
    }

    location = /auth/logout {
        proxy_pass http://127.0.0.1:3001/api/auth/logout;
        proxy_set_header Host $host;
    }

    location = /_auth/verify {
        internal;
        proxy_pass http://127.0.0.1:3001/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /_auth/verify-notebook {
        internal;
        proxy_pass http://127.0.0.1:3001/api/auth/verify-notebook;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Do not expose the backend-only authentication endpoints directly.
    location ^~ /api/auth/ {
        return 404;
    }

    location @landing_redirect {
        return 302 /?login=required;
    }

    location /api/ {
        auth_request /_auth/verify;
        auth_request_set $authenticated_user $upstream_http_x_authenticated_user;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header X-Remote-User $authenticated_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /voila/ {
        auth_request /_auth/verify-notebook;
        error_page 401 = @landing_redirect;
        proxy_pass http://127.0.0.1:8866;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        client_max_body_size 16k;
    }

    location / {
        auth_request /_auth/verify;
        auth_request_set $authenticated_user $upstream_http_x_authenticated_user;
        error_page 401 = @landing_redirect;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
